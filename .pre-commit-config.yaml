# Local hooks call the project's own pinned tools (package-lock.json), so
# pre-commit, scripts/verify.sh and CI cannot drift apart.
# Install once (needs Python): uv tool install pre-commit   # or: pipx install pre-commit
# then:                        pre-commit install
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        entry: npx --no-install prettier --check
        language: system
        types_or: [ts, javascript, json, markdown, yaml]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --max-warnings=0
        language: system
        types_or: [ts, javascript]
      - id: tsc
        name: tsc --noEmit
        entry: npx --no-install tsc --noEmit
        language: system
        types_or: [ts]
        pass_filenames: false
      - id: vitest
        name: vitest run
        entry: npx --no-install vitest run
        language: system
        types_or: [ts]
        pass_filenames: false
