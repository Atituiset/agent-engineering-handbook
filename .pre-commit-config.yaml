# Local hooks call the same pinned toolchain as scripts/verify.sh
# (rust-toolchain.toml), so pre-commit, verify.sh and CI cannot drift apart.
# Install once (needs Python): uv tool install pre-commit   # or: pipx install pre-commit
# then:                        pre-commit install
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked --quiet
        language: system
        types: [rust]
        pass_filenames: false
