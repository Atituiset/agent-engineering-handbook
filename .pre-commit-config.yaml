# Local hooks call the same tools as scripts/verify.sh, so pre-commit,
# verify.sh and CI cannot drift apart. Tool versions: see AGENTS.md.
# Install once (needs Python): uv tool install pre-commit   # or: pipx install pre-commit
# then:                        pre-commit install
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format --dry-run --Werror
        entry: clang-format --dry-run --Werror
        language: system
        types_or: [c]
        exclude: ^third_party/
      - id: verify
        name: build + clang-tidy + ctest (scripts/verify.sh)
        entry: bash scripts/verify.sh
        language: system
        types_or: [c, cmake]
        pass_filenames: false
