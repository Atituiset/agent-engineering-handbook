# Local hooks call the same pinned tools as scripts/verify.sh (Maven wrapper +
# pom.xml), so pre-commit, verify.sh and CI cannot drift apart.
# Install once (needs Python): uv tool install pre-commit   # or: pipx install pre-commit
# then:                        pre-commit install
repos:
  - repo: local
    hooks:
      - id: spotless
        name: spotless:check (google-java-format)
        entry: ./mvnw -B -q -ntp spotless:check
        language: system
        types: [java]
        pass_filenames: false
      - id: verify
        name: compile (Error Prone, -Werror) + JUnit (scripts/verify.sh)
        entry: bash scripts/verify.sh
        language: system
        files: \.(java|xml)$
        pass_filenames: false
