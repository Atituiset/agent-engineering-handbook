[project]
name = "durations"
version = "0.1.0"
description = "Starter-kit example: parse human-readable durations like '1h30m' into seconds."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durations"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
